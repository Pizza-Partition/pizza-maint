name: Release maintenance image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  runtime:
    needs: tests
    runs-on: ubuntu-26.04
    outputs:
      bundle: ${{ steps.locked.outputs.bundle }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node tools/install-zig.mjs
      - name: Fetch and authenticate the published runtime
        id: locked
        run: |
          set -euo pipefail
          zig build runtime-deps -Doptimize=safe -j4
          cp config/bundle/release.json zig-out/runtime/dependencies/release.json
          (cd zig-out/runtime/dependencies && sha256sum pizza-base-x86_64.img vmlinuz base.json > SHA256SUMS)
          python3 -c 'import json; print("bundle=" + json.load(open("config/bundle/release.json"))["commit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-runtime
          path: zig-out/runtime/dependencies/
          if-no-files-found: error
  candidate:
    needs: runtime
    uses: Pizza-Partition/Pizza/.github/workflows/candidate.yml@main
    with:
      maintenance-ref: ${{ github.sha }}
      bundle-ref: ${{ needs.runtime.outputs.bundle }}
      runtime-artifact: verified-runtime
  release:
    needs: candidate
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-maintenance-release
          path: dist/
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        if: startsWith(github.ref, 'refs/tags/v')
        id: attest
        with:
          subject-path: dist/*.tar.gz
      - name: Publish tested release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ATTESTATION: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION" dist/attestation.json
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
