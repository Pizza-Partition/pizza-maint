name: pizza-maint
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  ZIG: zig
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked Zig 0.17.0
        run: node tools/install-zig.mjs
      - name: Test locked toolchain installation rules
        run: node --test tools/install-zig.test.mjs
      - name: Install build and bundle tools
        run: sudo apt-get update && sudo apt-get install -y binutils libarchive-tools e2fsprogs dosfstools mtools ntfs-3g btrfs-progs
      - name: Install locked developer dependencies
        run: zig build deps
      - name: Check source formatting
        run: zig build fmt-check
      - name: Test protocol and maintenance sessions
        run: zig build check check-proto test-unit test-session test-maint-session-image -Doptimize=safe -j4 --summary all
      - name: Test storage, filesystems and crash recovery
        run: zig build test-filesystems test-storage-crash -Doptimize=safe -j4 --summary all
      - name: Export matching protocol
        run: zig build protocol-package -Doptimize=safe -j4 --summary all
      - name: Build static release artifacts
        run: zig build -Doptimize=safe
      - name: Assert static PID 1 binary
        run: |
          test -s zig-out/bin/pizza-init
          readelf -lW zig-out/bin/pizza-init > pid1-program-headers.txt
          if grep -q INTERP pid1-program-headers.txt; then
            echo 'Maintenance PID1 must not resolve host libc'; exit 1
          fi

# UEFI reboot and distro-matrix jobs require explicit kernel/image
# fixtures. They are not silently skipped or represented as green acceptance.
